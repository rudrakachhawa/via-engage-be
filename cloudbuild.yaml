steps:
  # Step 1 — build docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/engage-via-dm-repo/engage-via-dm-be:$COMMIT_SHA'
      - '.'

  # Step 2 — push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/engage-via-dm-repo/engage-via-dm-be:$COMMIT_SHA'

  # Step 3 — run prisma migrations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker run \
          -e DATABASE_URL=$$DATABASE_URL \
          asia-south1-docker.pkg.dev/$PROJECT_ID/engage-via-dm-repo/engage-via-dm-be:$COMMIT_SHA \
          npx prisma migrate deploy
    secretEnv: ['DATABASE_URL']

  # Step 4 — deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'engage-via-dm-be'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/engage-via-dm-repo/engage-via-dm-be:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,INSTA_APP_CLIENT_ID=INSTA_APP_CLIENT_ID:latest,INSTA_APP_CLIENT_SECRET=INSTA_APP_CLIENT_SECRET:latest,INSTA_APP_REDIRECT_URI=INSTA_APP_REDIRECT_URI:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,PORT=PORT:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/INSTA_APP_CLIENT_ID/versions/latest
      env: INSTA_APP_CLIENT_ID
    - versionName: projects/$PROJECT_ID/secrets/INSTA_APP_CLIENT_SECRET/versions/latest
      env: INSTA_APP_CLIENT_SECRET
    - versionName: projects/$PROJECT_ID/secrets/INSTA_APP_REDIRECT_URI/versions/latest
      env: INSTA_APP_REDIRECT_URI
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_PROJECT_ID/versions/latest
      env: FIREBASE_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_CLIENT_EMAIL/versions/latest
      env: FIREBASE_CLIENT_EMAIL
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_PRIVATE_KEY/versions/latest
      env: FIREBASE_PRIVATE_KEY
    - versionName: projects/$PROJECT_ID/secrets/PORT/versions/latest
      env: PORT

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/engage-via-dm-repo/engage-via-dm-be:$COMMIT_SHA'